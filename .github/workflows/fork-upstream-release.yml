name: Upstream release watch

# Fork only. Opens an issue when PatchMon publishes an official release that
# the fork's branch does not contain yet, so the fork gets synced and a new
# fork release built, and another when PatchMon changes a database migration
# the fork already carries. Never runs in the upstream repository.
#
# It compares against the fork's default branch (fork, see FORK.md); the
# FORK_BRANCH repository variable can name another. GitHub only runs
# scheduled workflows, and only offers "Run workflow", from the default branch.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository != 'PatchMon/PatchMon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: PatchMon/PatchMon
      FORK: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      FORK_BRANCH: ${{ vars.FORK_BRANCH }}
      LABEL: upstream-release
    steps:
      - name: Open an issue for a new upstream release
        run: |
          set -euo pipefail

          # Every value below comes from the API or a variable and reaches the
          # shell through env; each is checked before it is used.
          release="$(gh api "repos/$UPSTREAM/releases/latest")"
          tag="$(jq -r '.tag_name // empty' <<<"$release")"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::unexpected upstream release tag '$tag'; nothing done"
            exit 0
          fi
          published="$(jq -r '.published_at // empty' <<<"$release" | cut -c1-10)"
          printf '%s' "$published" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || published=""

          branch="${FORK_BRANCH:-$(gh api "repos/$FORK" --jq .default_branch)}"
          if ! printf '%s' "$branch" | grep -qE '^[A-Za-z0-9._/-]+$' || [[ "$branch" == *..* ]]; then
            echo "::error::invalid branch name '$branch'"
            exit 1
          fi
          echo "Latest upstream release: $tag; fork branch: $branch"

          # Nothing to do when the branch already contains the release.
          # A failed comparison (a FORK_BRANCH that no longer exists, say)
          # fails the run, so GitHub reports it, rather than opening an issue
          # for a release the branch may already contain.
          sha="$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)"
          if ! status="$(gh api "repos/$FORK/compare/$sha...$branch" --jq .status)"; then
            echo "::error::cannot compare $tag with $branch; check the branch, or the FORK_BRANCH variable"
            exit 1
          fi
          case "$status" in
            identical|ahead)
              echo "$branch already contains $tag"
              exit 0
              ;;
          esac

          # One issue per release, open or closed.
          title="PatchMon $tag est disponible"
          gh label create "$LABEL" -R "$FORK" --color 0E8A16 \
            --description "Official PatchMon release to merge into the fork" --force
          existing="$(gh issue list -R "$FORK" --label "$LABEL" --state all \
            --search "$tag in:title" --json title \
            --jq "[.[] | select(.title == \"$title\")] | length")"
          if [ "$existing" != "0" ]; then
            echo "An issue for $tag already exists"
            exit 0
          fi

          v="${tag#v}"
          next="${v%.*}.$(( ${v##*.} + 1 ))"
          {
            echo "PatchMon **$tag** est sorti${published:+ le $published} et la branche \`$branch\` du fork ne le contient pas encore."
            echo
            echo "- Notes de version : https://github.com/$UPSTREAM/releases/tag/$tag"
            echo "- Ce qui arrive dans le fork : https://github.com/$FORK/compare/$branch...PatchMon:PatchMon:$tag"
            echo
            echo "### Mettre le fork à jour"
            echo
            echo '```bash'
            echo "git fetch upstream --tags"
            echo "git checkout $branch"
            echo "git merge $tag            # résoudre les conflits, lancer les tests"
            echo "git push origin $branch"
            echo "tools/fork-release.sh --push  # tag v$next-fork.1 : la CI construit l'image"
            echo '```'
            echo
            echo "Puis sur le serveur : \`docker compose pull server && docker compose up -d server\`, et **Update Now** sur les hosts."
            echo
            echo "Ferme cette issue une fois le fork à jour. cc @$OWNER"
          } > body.md

          gh issue create -R "$FORK" --title "$title" --label "$LABEL" --body-file body.md

      # The fork carries PatchMon commits that PatchMon has not released yet
      # (see FORK.md), including database migrations its databases have run.
      # PatchMon may still change such a migration before releasing it; a
      # database that ran the old file would then never run the new one. The
      # fork adds no migration of its own (its schema changes are steps in
      # internal/forkschema), so every file here must match PatchMon's main.
      # Runs even when the release check failed (an API error, say).
      - name: Check out the fork branch
        if: ${{ !cancelled() }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ vars.FORK_BRANCH || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Open an issue when PatchMon changed a migration the fork has
        if: ${{ !cancelled() }}
        env:
          MIGRATION_LABEL: upstream-migration
          MIGRATIONS: server-source-code/internal/migrate/migrations
        run: |
          set -euo pipefail
          git fetch -q --depth=1 --no-tags "https://github.com/$UPSTREAM.git" main
          changed=()
          while IFS= read -r -d '' f; do
            if ! git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              changed+=("$f (removed or renumbered by PatchMon)")
            elif ! git diff --quiet FETCH_HEAD HEAD -- "$f"; then
              changed+=("$f (changed by PatchMon)")
            fi
          done < <(git ls-files -z -- "$MIGRATIONS")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Every migration of the fork matches PatchMon's main"
            exit 0
          fi
          printf 'Differs from PatchMon main: %s\n' "${changed[@]}"

          title="PatchMon a modifié des migrations déjà présentes dans le fork"
          gh label create "$MIGRATION_LABEL" -R "$FORK" --color B60205 \
            --description "A migration the fork carries changed upstream" --force
          open="$(gh issue list -R "$FORK" --label "$MIGRATION_LABEL" --state open --json title \
            --jq "[.[] | select(.title == \"$title\")] | length")"
          if [ "$open" != "0" ]; then
            echo "An open issue already reports it"
            exit 0
          fi
          {
            echo "Ces migrations du fork ne correspondent plus à celles de PatchMon \`main\` :"
            echo
            for c in "${changed[@]}"; do echo "- \`$c\`"; done
            echo
            echo "Une base qui a déjà exécuté l'ancienne version ne lancera pas la nouvelle : golang-migrate ne retient que le numéro."
            echo "Avant de fusionner la prochaine version officielle, compare les deux versions de chaque fichier et prévois la correction de la base (voir « Suivre les versions officielles » dans FORK.md)."
            echo
            echo "cc @$OWNER"
          } > migrations.md
          gh issue create -R "$FORK" --title "$title" --label "$MIGRATION_LABEL" --body-file migrations.md
